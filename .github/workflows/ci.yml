name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # job name is the required status check context for branch protection
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build (gcc)
        run: make

      - name: offline smoke tests
        run: make test

      - name: build with clang -Werror
        run: |
          make clean
          make CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE"

      - name: plugin example still compiles
        run: make examples/hello_plugin.so

      - name: binary stays tiny
        run: test $(stat -c %s motiris) -lt 163840

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: motiris-linux-x86_64
          path: motiris
          if-no-files-found: error

  # performance & resource guard: cold-start latency, peak RSS, agent-loop
  # overhead. Informational check (not required for merge).
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: make

      - name: install /usr/bin/time
        run: sudo apt-get update -qq && sudo apt-get install -y -qq time

      - name: run perf benchmarks
        run: sh tests/perf.sh

  # build+test compatibility across mainstream distros/compilers.
  # Informational (not required for merge), guards the release matrix.
  compat-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04 gcc-11
            os: ubuntu-22.04
          - name: ubuntu-24.04 gcc-13
            os: ubuntu-24.04
          - name: ubuntu-26.04 gcc-15
            os: ubuntu-26.04
          - name: centos-stream9 gcc-11
            os: ubuntu-latest
            container: quay.io/centos/centos:stream9
          - name: ubuntu-latest clang
            os: ubuntu-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: install build deps (rpm distros)
        if: matrix.container != ''
        run: dnf install -y --setopt=install_weak_deps=False gcc make libcurl python3 curl iproute

      - name: build
        run: make ${{ matrix.cc && format('CC={0}', matrix.cc) }}

      - name: offline smoke tests
        run: sh tests/smoke.sh

      - name: plugin example compiles
        run: make examples/hello_plugin.so