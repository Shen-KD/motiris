name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # aggregate gate — THIS job name is the required status check on main
  ci:
    runs-on: ubuntu-latest
    needs: [build, clang, test-core, test-tools, test-repl, test-skills,
            test-schema, plugins, tools]
    steps:
      - run: echo "all gating jobs passed"

  # full clean compile + link (gcc) + size guard + binary artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clean build + link (gcc)
        run: make clean && make

      - name: binary stays tiny
        run: test $(stat -c %s motiris) -lt 163840

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: motiris-linux-x86_64
          path: motiris
          if-no-files-found: error

  # strict full build with clang -Werror (every warning fails the job)
  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: full compile + link with clang -Werror
        run: |
          make clean
          make CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE"

  # component-scoped smoke runs (sh tests/smoke.sh <group>)
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke — core (agent loop, plugins, save/resume, env)
        run: sh tests/smoke.sh core

  test-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke — tools (fallback, gateway, file/web/memory, cron, MCP, SSE)
        run: sh tests/smoke.sh tools

  test-repl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke — repl (commands, banner, token stats, /skills)
        run: sh tests/smoke.sh repl

  test-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke — skills & sessions (skill_patch/write, /sessions, /resume)
        run: sh tests/smoke.sh skills

  test-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke — per-tool schema files (override, invalid json, plugin dir)
        run: sh tests/smoke.sh schema

  # plugin artifacts compile standalone (flat + per-tool dir layout)
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: plugin example compiles (gcc)
        run: make examples/hello_plugin.so

      - name: plugin example compiles (clang -Werror)
        run: |
          make clean
          make examples/hello_plugin.so CC=clang \
            CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -fPIC -shared"

  # component static libs compile/link independently (tools, core, harness)
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: component libs compile independently (clang -Werror)
        run: |
          make clean
          make libmotiris_core.a libmotiris_tools.a libmotiris_harness.a \
            CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE"

  # performance & resource guard: cold-start latency, peak RSS, agent-loop
  # overhead. Informational check (not required for merge).
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: make

      - name: install /usr/bin/time
        run: sudo apt-get update -qq && sudo apt-get install -y -qq time

      - name: run perf benchmarks
        run: sh tests/perf.sh

  # build+test compatibility across mainstream distros/compilers.
  # Informational (not required for merge), guards the release matrix.
  compat-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04 gcc-11
            os: ubuntu-22.04
          - name: ubuntu-24.04 gcc-13
            os: ubuntu-24.04
          - name: ubuntu-26.04 gcc-15
            os: ubuntu-26.04
          - name: centos-stream9 gcc-11
            os: ubuntu-latest
            container: quay.io/centos/centos:stream9
          - name: ubuntu-latest clang
            os: ubuntu-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: install build deps (rpm distros)
        if: matrix.container != ''
        run: dnf install -y --setopt=install_weak_deps=False gcc make python3 iproute

      - name: build
        run: make ${{ matrix.cc && format('CC={0}', matrix.cc) }}

      - name: offline smoke tests (full suite)
        run: sh tests/smoke.sh

      - name: plugin example compiles
        run: make examples/hello_plugin.so